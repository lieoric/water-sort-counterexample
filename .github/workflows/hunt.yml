name: Hunt counterexample
run-name: Hunt c${{ inputs.colors }} h${{ inputs.height }} k${{ inputs.empty_columns }} layer${{ inputs.uniform_layer }}

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per shard
        required: true
        default: "900"
        type: string
      solution_cap:
        description: Border-sequence count cap used as fitness
        required: true
        default: "10000"
        type: string
      fitness:
        description: Primary mutation-search fitness
        required: true
        default: solutions
        type: choice
        options: [solutions, safe-initial]
      seed_instance:
        description: Optional repository-relative starting instance
        required: false
        default: ""
        type: string
      restart_interval:
        description: Reset to seed/random instance every N iterations; 0 disables
        required: true
        default: "2000"
        type: string
      height:
        description: Items per full column
        required: true
        default: "16"
        type: string
      colors:
        description: Colors and initially full columns
        required: true
        default: "5"
        type: string
      empty_columns:
        description: Initially empty columns
        required: true
        default: "2"
        type: string
      uniform_layer:
        description: Fix this bottom-based layer to color 0; -1 disables
        required: true
        default: "-1"
        type: string
      isolate_uniform_layer:
        description: Keep color 0 out of the two neighboring layers (0 or 1)
        required: true
        default: "0"
        type: string
      fully_alternating:
        description: Require every adjacent pair in a column to differ (0 or 1)
        required: true
        default: "0"
        type: string
      target_height:
        description: Descend a found NO to this height; 0 disables
        required: true
        default: "0"
        type: string
      frontier_limit:
        description: Certified NO descendants retained at each height
        required: true
        default: "64"
        type: string

permissions:
  contents: read

concurrency:
  group: water-sort-hunt-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and validate once
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          mkdir tools
          cp build/water-hunter build/water-descend build/water-verify tools/
          tar -czf water-tools.tar.gz tools
      - uses: actions/upload-artifact@v6
        with:
          name: hunt-tools
          path: water-tools.tar.gz
          retention-days: 7

  hunt:
    needs: prepare
    name: Shard ${{ matrix.shard }} of 8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SEED_INSTANCE: ${{ inputs.seed_instance }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: hunt-tools
      - run: tar -xzf water-tools.tar.gz
      - name: Hunt
        run: |
          seed_args=()
          if [[ -n "$SEED_INSTANCE" ]]; then
            seed_args=(--input "$SEED_INSTANCE")
          fi
          tools/water-hunter \
            "${seed_args[@]}" \
            --seed "${{ github.run_id }}" \
            --shard "${{ matrix.shard }}" \
            --shards 8 \
            --seconds "${{ inputs.seconds }}" \
            --solution-cap "${{ inputs.solution_cap }}" \
            --fitness "${{ inputs.fitness }}" \
            --restart-interval "${{ inputs.restart_interval }}" \
            --height "${{ inputs.height }}" \
            --colors "${{ inputs.colors }}" \
            --empty "${{ inputs.empty_columns }}" \
            --uniform-layer "${{ inputs.uniform_layer }}" \
            --isolate-uniform-layer "${{ inputs.isolate_uniform_layer }}" \
            --fully-alternating "${{ inputs.fully_alternating }}" \
            --out "out/shard-${{ matrix.shard }}"
      - name: Verify a discovered counterexample
        if: ${{ hashFiles(format('out/shard-{0}/counterexample.txt', matrix.shard)) != '' }}
        run: |
          tools/water-verify \
            --input "out/shard-${{ matrix.shard }}/counterexample.txt" \
            --certificate "out/shard-${{ matrix.shard }}/counterexample.wscert"
      - name: Descend a discovered counterexample
        if: ${{ hashFiles(format('out/shard-{0}/counterexample.txt', matrix.shard)) != '' && inputs.target_height != '0' }}
        continue-on-error: true
        run: |
          tools/water-descend \
            --input "out/shard-${{ matrix.shard }}/counterexample.txt" \
            --target-height "${{ inputs.target_height }}" \
            --frontier-limit "${{ inputs.frontier_limit }}" \
            --seed "$(( ${{ github.run_id }} + ${{ matrix.shard }} ))" \
            --out "out/shard-${{ matrix.shard }}/descent"
      - name: Verify a complete descent path
        if: ${{ hashFiles(format('out/shard-{0}/descent/h{1}.txt', matrix.shard, inputs.target_height)) != '' }}
        run: |
          for instance in "out/shard-${{ matrix.shard }}"/descent/h*.txt; do
            tools/water-verify \
              --input "$instance" \
              --certificate "${instance%.txt}.wscert"
          done
      - name: Add shard report to summary
        if: always()
        run: |
          if test -f "out/shard-${{ matrix.shard }}/report.json"; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "out/shard-${{ matrix.shard }}/report.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload shard artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hunt-shard-${{ matrix.shard }}
          path: out/shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 30
