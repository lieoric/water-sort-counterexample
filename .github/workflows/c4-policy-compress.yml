name: Compress c4 k2 controlled policy
run-name: Compare finite default rules plus exceptions

on:
  # Bootstrap this research workflow before the draft PR reaches main.
  push:
    branches: [agent/minimum-height-five]
    paths: [.github/workflows/c4-policy-compress.yml]
  workflow_dispatch:
    inputs:
      source_run:
        description: Frontier-policy run containing the merged catalog
        required: true
        default: "31328370710"
        type: string
      attempts_per_heuristic:
        description: Independent attempts for every default rule
        required: true
        default: "2"
        type: choice
        options: ["1", "2", "4"]
      restarts:
        description: Restarts per attempt
        required: true
        default: "64"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: c4-k2-compress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      expected: ${{ steps.matrix.outputs.expected }}
    steps:
      - uses: actions/checkout@v5
      - name: Build comparison matrix
        id: matrix
        env:
          ATTEMPTS: ${{ inputs.attempts_per_heuristic || '2' }}
        run: |
          heuristics='["first","last","finish","expose","min-need","max-need","deficient-first","deficient-finish"]'
          matrix=$(jq -cn --argjson heuristics "$heuristics" --argjson count "$ATTEMPTS" \
            '[$heuristics[] as $heuristic | range(0; $count) as $attempt | {heuristic: $heuristic, attempt: $attempt}] | to_entries | map(.value + {index: .key})')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "expected=$(jq 'length' <<< "$matrix")" >> "$GITHUB_OUTPUT"
      - name: Download the exact sampled catalog
        uses: actions/download-artifact@v6
        with:
          name: frontier-merged-all-heights
          path: source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run || '31328370710' }}
      - name: Build and test once
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWSC_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          test -s source/instances.tsv
          test -s source/conflicts.tsv
          mkdir bundle
          cp build/water-policy-control bundle/
          cp source/instances.tsv source/conflicts.tsv bundle/
          tar -czf compression-inputs.tar.gz bundle
      - uses: actions/upload-artifact@v6
        with:
          name: compression-inputs
          path: compression-inputs.tar.gz
          retention-days: 7

  compress:
    needs: prepare
    name: ${{ matrix.heuristic }} / ${{ matrix.attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: compression-inputs
      - run: tar -xzf compression-inputs.tar.gz
      - name: Synthesize exceptions to the finite default rule
        env:
          RESTARTS: ${{ inputs.restarts || '64' }}
        run: |
          seed=$((${{ github.run_id }} * 32 + ${{ matrix.index }}))
          bundle/water-policy-control \
            --catalog bundle/instances.tsv \
            --conflicts bundle/conflicts.tsv \
            --depth 3 \
            --goal-exhausted 2 \
            --default-heuristic "${{ matrix.heuristic }}" \
            --restarts "$RESTARTS" \
            --repair-passes 128 \
            --seed "$seed" \
            --out "out/${{ matrix.heuristic }}-${{ matrix.attempt }}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: compression-${{ matrix.heuristic }}-${{ matrix.attempt }}
          path: out/${{ matrix.heuristic }}-${{ matrix.attempt }}/
          if-no-files-found: error
          retention-days: 30

  merge:
    needs: [prepare, compress]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          pattern: compression-*-*
          path: collected
      - name: Compare rules and classify exceptions
        env:
          EXPECTED: ${{ needs.prepare.outputs.expected }}
        run: |
          python3 scripts/merge_compression_reports.py \
            --input collected \
            --output merged \
            --expected-attempts "$EXPECTED"
          cat merged/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: compressed-policy-merged
          path: merged/
          retention-days: 30
