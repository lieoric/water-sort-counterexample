name: Verify counterexample

on:
  workflow_dispatch:
    inputs:
      instance:
        description: Repository path to the instance
        required: true
        default: counterexamples/counterexample.txt
        type: string
      certificate:
        description: Repository path to the .wscert file
        required: true
        default: counterexamples/counterexample.wscert
        type: string
  push:
    paths:
      - "counterexamples/*.txt"
      - "counterexamples/*.wscert"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build verifier
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Verify
        env:
          MANUAL_INSTANCE: ${{ inputs.instance }}
          MANUAL_CERTIFICATE: ${{ inputs.certificate }}
        run: |
          if test -n "$MANUAL_INSTANCE"; then
            test -f "$MANUAL_INSTANCE"
            test -f "$MANUAL_CERTIFICATE"
            ./build/water-verify \
              --input "$MANUAL_INSTANCE" \
              --certificate "$MANUAL_CERTIFICATE"
          else
            for instance in counterexamples/ce-*.txt; do
              certificate="${instance%.txt}.wscert"
              test -f "$certificate"
              ./build/water-verify --input "$instance" --certificate "$certificate"
            done
          fi
