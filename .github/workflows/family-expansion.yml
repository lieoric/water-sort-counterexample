name: Expand two-empty counterexample family

on:
  workflow_dispatch:
    inputs:
      radius:
        description: Swap radius around each mother instance
        required: true
        default: "2"
        type: string
      frontier_limit:
        description: Deterministic NO representatives expanded after each layer
        required: true
        default: "50"
        type: string
      certificate_limit:
        description: NO certificates saved per distance and job
        required: true
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: two-empty-family-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and test once
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWSC_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          mkdir tools
          cp build/water-neighborhood build/water-verify tools/
          tar -czf water-tools.tar.gz tools
      - uses: actions/upload-artifact@v6
        with:
          name: family-tools
          path: water-tools.tar.gz
          retention-days: 7

  expand:
    needs: prepare
    name: Expand ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - id: ce-000
            input: counterexamples/ce-000.txt
          - id: ce-004
            input: counterexamples/ce-004.txt
          - id: ce-005
            input: counterexamples/ce-005.txt
          - id: ce-006
            input: counterexamples/ce-006.txt
          - id: ce-007
            input: counterexamples/ce-007.txt
          - id: minimized-15b
            input: experiments/minimized-15b.txt
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: family-tools
      - name: Extract tools
        run: tar -xzf water-tools.tar.gz
      - name: Expand verified NO frontier
        run: |
          mkdir seed
          cp "${{ matrix.input }}" "seed/${{ matrix.id }}.txt"
          tools/water-neighborhood \
            --seed-dir seed \
            --empty 2 \
            --radius "${{ inputs.radius }}" \
            --frontier-limit "${{ inputs.frontier_limit }}" \
            --certificate-limit "${{ inputs.certificate_limit }}" \
            --out "out/${{ matrix.id }}"
      - name: Independently verify saved NO certificates
        run: |
          for instance in out/${{ matrix.id }}/no-*.txt; do
            test -e "$instance" || continue
            tools/water-verify \
              --input "$instance" \
              --certificate "${instance%.txt}.wscert"
          done
      - name: Add report to summary
        if: always()
        run: |
          if test -f "out/${{ matrix.id }}/report.json"; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "out/${{ matrix.id }}/report.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: family-${{ matrix.id }}
          path: out/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 30

  merge:
    needs: expand
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: family-*
          path: collected
      - name: Merge exact classes at minimum observed distance
        run: |
          mkdir merged
          printf 'class_id\tresult\tempty\tdistance\tborders\toracle_states\tterminals\tsignatures\tcanonical\n' \
            > merged/results.tsv
          find collected -name results.tsv -type f -print0 | sort -z | \
            while IFS= read -r -d '' file; do tail -n +2 "$file"; done \
            | LC_ALL=C sort -t $'\t' -k1,1 -k4,4n \
            | awk -F '\t' '!seen[$1]++' >> merged/results.tsv
          total=$(tail -n +2 merged/results.tsv | wc -l)
          yes=$(tail -n +2 merged/results.tsv | awk -F '\t' '$2 == "YES" {n++} END {print n+0}')
          no=$(tail -n +2 merged/results.tsv | awk -F '\t' '$2 == "NO" {n++} END {print n+0}')
          {
            echo "## Two-empty counterexample family expansion"
            echo
            echo "- Radius: ${{ inputs.radius }}"
            echo "- Frontier limit per mother: ${{ inputs.frontier_limit }}"
            echo "- Exact symmetry classes: $total"
            echo "- Solvable: $yes"
            echo "- Unsolvable: $no"
            echo
            echo "### Minimum-distance distribution"
            tail -n +2 merged/results.tsv | awk -F '\t' '{all[$4]++; if ($2 == "NO") no[$4]++} END {for (d in all) print "- Distance " d ": " all[d] " classes, " no[d]+0 " NO"}' | sort
          } | tee merged/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: family-merged-radius-${{ inputs.radius }}
          path: merged/
          retention-days: 30
