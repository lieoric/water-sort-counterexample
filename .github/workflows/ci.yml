name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cxx: g++
          - compiler: Clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DWSC_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: 5x16 smoke test
        run: ./build/water-oracle --input examples/5x16.txt --count 1000

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        env:
          CXX: clang++
        run: >-
          cmake -S . -B build-san
          -DCMAKE_BUILD_TYPE=Debug
          -DWSC_ENABLE_SANITIZERS=ON
          -DWSC_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-san --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-san --output-on-failure
